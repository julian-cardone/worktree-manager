# Runs the same configure, build, test, and format commands as README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # wt is POSIX-only. macOS is covered deliberately: paths there are
        # compared after Unicode precomposition, which uses iconv.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          cmake --version
          c++ --version
          git --version

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      # Every test runs in its own temp sandbox with its own HOME and Git
      # config, so tests can run in parallel and need no runner Git setup.
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Pinned so formatting does not drift with the runner's clang-format.
      - name: Install clang-format
        run: pipx install clang-format==23.1.3

      - name: Check formatting
        run: |
          clang-format --version
          git ls-files -z '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror
