# Publishes a GitHub Release when a version tag (e.g. v0.1.0) is pushed.
# Nothing is published unless the macOS arm64 build passes the full test
# suite and reports exactly the tagged version. See "Releases" in README.md.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tag:
    name: Check tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Releases are cut only from commits that already landed on main.
      - name: Check the tagged commit is on main
        run: |
          commit=$(git rev-parse "$GITHUB_REF^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $commit, which is not on main; nothing was published."
            exit 1
          fi

      # Checked here so a missing file stops the release before packaging.
      - name: Check the release notes exist
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing or empty at $GITHUB_REF_NAME; nothing was published."
            exit 1
          fi

  package:
    name: Package (macos-arm64)
    needs: check-tag
    # Releases ship only macOS arm64 for now; CI still tests Linux too.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          cmake --version
          c++ --version
          git --version

      - name: Build, test, and package
        run: scripts/package-release.sh build-release

      # The version lives only in CMakeLists.txt; the tag must agree with it.
      - name: Check the binary reports the tagged version
        run: |
          actual=$(build-release/wt --version)
          expected="wt ${GITHUB_REF_NAME#v}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME expects '$expected' but the binary reports '$actual'; nothing was published."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: package-macos-arm64
          path: build-release/wt-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Only for the release notes.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/releases

      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum wt-*.tar.gz > SHA256SUMS

      # gh creates the release as a draft and publishes it only once every
      # asset has uploaded, so a failure leaves a draft, never a public
      # release with missing assets. An existing release (draft or not) for
      # the tag is never modified. GitHub appends its generated notes (the
      # "Full Changelog" link) to the release's own notes file.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::A release for $GITHUB_REF_NAME already exists; inspect or delete it, then rerun this workflow. Nothing was changed."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "wt ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" --generate-notes
